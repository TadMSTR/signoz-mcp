[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signoz-mcp"
version = "0.3.0"
description = "FastMCP server for SigNoz observability queries — read-only access to services, traces, logs, metrics, and alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "signoz", "observability", "traces", "logs", "metrics", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.urls]
Homepage = "https://github.com/TadMSTR/signoz-mcp"
Repository = "https://github.com/TadMSTR/signoz-mcp"
Issues = "https://github.com/TadMSTR/signoz-mcp/issues"
Changelog = "https://github.com/TadMSTR/signoz-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# All telemetry backends are optional and off by default (see signoz_mcp/telemetry.py).
# The base install carries none of these; enabling a backend needs this extra.
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    # forge runs influxdb:3-core — the v3 write API (imports as influxdb_client_3).
    "influxdb3-python>=0.9",
    "nats-py>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=4.0",
    "ruff",
]

[project.scripts]
signoz-mcp = "signoz_mcp.server:main"

[tool.setuptools.packages.find]
include = ["signoz_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.coverage.run]
omit = [
    "signoz_mcp/__main__.py",
    "signoz_mcp/observability.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
