[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signoz-mcp"
version = "0.4.0"
description = "FastMCP server for SigNoz observability queries — read-only access to services, traces, logs, metrics, and alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "signoz", "observability", "traces", "logs", "metrics", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# BOUNDED RANGES, NOT BARE FLOORS. This repo carries `ships` (deployed: true), so
# repo-standards' Dependencies block applies. Cite vikunja#627: vikunja-mcp declared
# `fastmcp>=2.0`, resolved to 4.0.1 — two majors past anything tested — and the drift
# went unobserved for ten days.
#
# The ceilings below are not decorative; each was measured against PyPI on 2026-09-20:
#   fastmcp   latest 4.0.5, ceiling <4.0.0 holds it at the tested 3.3.1. Already correct.
#   httpx     latest 0.28.1 == tested. For a 0.x package the MINOR is the breaking
#             boundary, so the ceiling is <0.29 rather than <1.
#   structlog latest 26.1.0, tested 25.5.0. The bare `>=24.0` floor it replaces would
#             resolve to 26.x today — an untested major, silently.
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "httpx>=0.27,<0.29",
    "structlog>=24.0,<26.0",
]

[project.urls]
Homepage = "https://github.com/TadMSTR/signoz-mcp"
Repository = "https://github.com/TadMSTR/signoz-mcp"
Issues = "https://github.com/TadMSTR/signoz-mcp/issues"
Changelog = "https://github.com/TadMSTR/signoz-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# All telemetry backends are optional and off by default (see src/signoz_mcp/telemetry.py).
# The base install carries none of these; enabling a backend needs this extra.
telemetry = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    # forge runs influxdb:3-core — the v3 write API (imports as influxdb_client_3).
    "influxdb3-python>=0.9",
    "nats-py>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=4.0",
    # PINNED EXACTLY, and the exactness is the point. `ruff` was unbounded, so the CI
    # matrix installed whatever was newest while the local venv held whatever it had.
    # Measured 2026-09-20: local 0.15.22 vs CI 0.16.8 — `ruff format --check` went red
    # in CI on code that `ruff format` had just cleaned locally, because the formatter's
    # own rules changed between those versions. A formatter that is not pinned is a gate
    # whose result depends on when you ran it.
    #
    # Bumps come via Dependabot's batched dev-dependency PR, which is where a formatting
    # change belongs: visible, in one diff, and deliberate.
    "ruff==0.16.8",
]

[project.scripts]
signoz-mcp = "signoz_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["signoz_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    # Integration tests that need a real SigNoz backend (tests/test_live_signoz.py).
    # They skip unless SIGNOZ_LIVE=1. Registered here so the skip is a deliberate,
    # named state rather than an unknown-marker warning — a SKIP is not a PASS, and
    # these are the only tests that can catch an INCOMPLETE result (vikunja#322).
    "live: requires a reachable SigNoz instance; opt in with SIGNOZ_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.coverage.run]
omit = [
    "src/signoz_mcp/__main__.py",
    "src/signoz_mcp/observability.py",
]

[tool.coverage.report]
# RATCHETED COVERAGE FLOOR — F8, and Gate Honesty's "do not shave it to make a red
# build green".
#
# Measured 2026-09-20 at the end of build signoz-mcp-standard-defects-2026-09:
# 87.32% (686 statements, 87 missed). Ratcheted 80 -> 86 -> 87 during that build.
#
# The 80 it started from sat six points below reality, so the gate would have permitted
# a six-point regression without going red. Cite vikunja#680: searxng-mcp's floor sat at
# 72/65/74/74 for ten releases while real coverage climbed twelve points, and the gate
# silently allowed a twelve-point drop that whole time.
#
# The intermediate step is worth recording: after the #322 fix landed, coverage fell to
# 85.88% and this gate went RED. The response was to test the new code, not to lower the
# floor. That is the rule — do not shave it to make a red build green. If it goes DOWN,
# that is a finding to explain in the CHANGELOG, not a number to edit.
fail_under = 87
show_missing = true
