# Secret scanning — B14.
#
# TWO TRIGGERS, TWO DIFFERENT JOBS TO DO, and the second is the one usually dropped:
#
#   push / pull_request — gate the incoming change.
#   schedule — scan FULL HISTORY. This needs fetch-depth: 0. A shallow checkout scans
#     one commit, which passes trivially and says nothing about the other fifty. A
#     credential in public history survives deletion of the commit that introduced it —
#     measured while building this gate: after `git rm` + commit of a planted secret,
#     gitleaks still exits 1. The cited incident is five room IDs leaked into public git
#     history by the matrix repos.
#
# This repo is PUBLIC on GitHub (declared 2026-09-20), so history is readable by anyone
# and "we removed it" is not a remediation.
#
# fetch-depth: 0 is set unconditionally rather than per-trigger — the gating run is cheap
# at this repo size, and a depth that depends on the trigger is one edit away from being
# wrong in the direction that fails silently.

name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 06:11 UTC. Off the hour deliberately — scheduled jobs at :00 queue
    # behind everyone else's. Clear of codeql.yml (03:29 Sun) and scorecard.yml (04:47 Sun).
    - cron: "11 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history. The tip being clean says nothing about history. Comment kept on
          # its own line: repo-conform's B14 check anchors `fetch-depth:\s*0\s*$` to
          # end-of-line, so an inline comment here would read as a shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Pinned version, and installed here rather than assumed present. gitleaks happens
      # to be at /usr/bin/gitleaks on the forge host this repo is developed on, which is
      # exactly how a job picks up an undeclared dependency and stops being reproducible
      # on a clean runner. The host copy also reports `version is set by build process`,
      # so what passes locally is not even a known version.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # BEFORE the clean result is believed. "no leaks found" is what a working gate
      # reports on a clean tree and what a broken one reports on any tree at all. This
      # probe plants a synthetic credential in a throwaway copy and asserts the scan goes
      # red, then asserts the real tree goes green. See tests/check_gitleaks_gate.py.
      - name: Prove the gate fires on a planted secret
        run: python tests/check_gitleaks_gate.py

      - name: Scan full history
        run: gitleaks detect --source . --redact --no-banner
