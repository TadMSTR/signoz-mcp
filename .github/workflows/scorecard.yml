# OSSF Scorecard — supply chain risk scoring. F4.
#
# TREAT THE SCORE AS A MEASUREMENT, NOT A TARGET. Several checks assess things this
# repository deliberately does not do (signed releases, branch protection on a
# single-maintainer project), and chasing the number would mean adopting process for the
# sake of a metric.
#
# NOTE ON THE FIRST RESULT. This workflow has no `pull_request` trigger, so the baseline
# cannot come from the PR that adds it — the first run is the first push to main
# afterwards. webhook-doorman and scoped-mcp both hit exactly this: do not read the PR's
# green tick as a score. Record the first real score in CHANGELOG.md with its date, the
# same discipline the coverage floor in pyproject.toml is under (vikunja#680).
#
# What it is genuinely good at is catching regressions in things this repo does care
# about: an unpinned action appearing in a workflow, a dependency update path going
# stale, a token gaining more scope than it needs. That last one is not hypothetical —
# Scorecard's Token-Permissions check is what scored searxng-mcp 0/10, and it is the
# check ci.yml would have been marked down for until this build gave it a top-level
# `permissions:` block (F6).
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly, offset from codeql.yml (03:29 Sun) and secret-scan.yml (06:11 Mon) so the
    # three do not contend.
    - cron: "47 4 * * 0"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Needed by publish_results below: the action exchanges this for an OIDC token so
      # the public API can attest the result came from this repository rather than being
      # self-reported.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API, which is what makes the score visible to
          # anyone evaluating this project without running Scorecard themselves. That is
          # the entire point of enabling it — a private score answers a question nobody
          # asked. It is also a new OUTBOUND PUBLICATION from this repo; flagged
          # deliberately in this build's audit request rather than slipped in.
          publish_results: true

      # Retained separately from the SARIF upload because the Security tab keeps only the
      # latest result, and comparing two runs is how you tell a real regression from a
      # check whose scoring changed upstream.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
