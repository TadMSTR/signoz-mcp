name: Release

on:
  push:
    tags:
      - "v*"

# TOP-LEVEL LEAST PRIVILEGE — F6. This was previously `contents: write` at the top
# level, which handed write to BOTH jobs when only one creates the release. The standard
# is read at the top and escalation at the job that needs it; see create-github-release
# below.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # The build frontend is pinned like the backend (pyproject build-system.requires):
      # this job produces the shipped artefact.
      - name: Install build tools
        run: pip install "build==1.6.1"

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # The escalation, scoped to the one job that publishes. `gh release create`
      # and `gh release upload` both write to the repo's releases.
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # This job holds contents: write. Leave no token in .git/config.
          persist-credentials: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            gh release upload "${TAG_NAME}" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/*.whl dist/*.tar.gz \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
